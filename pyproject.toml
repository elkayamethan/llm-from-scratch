[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-from-scratch"
version = "1.0.0"
description = "add later"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.11.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.2",
    "tiktoken>=0.12",
    "numpy>=2.1",
]

[project.optional-dependencies]
data = ["pyarrow>=23", "huggingface_hub>=0.27"]
dev = ["pytest>=9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[project.scripts]
prepare-fineweb-edu = "cli.prepare_fineweb_edu:main"
