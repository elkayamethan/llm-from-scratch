[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-from-scratch"
version = "1.0.0"
description = "add later"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.11.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
